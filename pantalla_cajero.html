<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Heladería - Verificación Bancolombia</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; text-align: center; padding: 40px; }
        .card { background: white; max-width: 480px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h2 { color: #333; margin-bottom: 5px; }
        .status { padding: 25px; font-size: 22px; font-weight: bold; border-radius: 12px; margin: 25px 0; transition: all 0.3s ease; }
        .esperando { background-color: #fff8e1; color: #b78103; border: 2px solid #ffe082; }
        .pagado { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; animation: pulse 1s infinite alternate; }
        button { background-color: #0d6efd; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0b5ed7; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.02); } }
    </style>
</head>
<body>

    <div class="card">
        <h2>🍦 Heladería - Control de Caja</h2>
        <p style="color: #66c;">Verificador de Transferencias Bancolombia</p>
        
        <div id="estadoPago" class="status esperando">
            ⏳ Esperando transferencia...
        </div>

        <button id="btnLimpiar" style="display:none;" onclick="limpiarPantalla()">
            🔄 Confirmar y Esperar Siguiente Pago
        </button>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL POR LA DE TU SERVIDOR EN RENDER
        const URL_SERVIDOR = "https://tu-app-en-render.onrender.com"; 

        async function consultarPago() {
            try {
                const res = await fetch(`${URL_SERVIDOR}/estado-pago`);
                const data = await res.json();

                if (data.confirmado) {
                    const caja = document.getElementById("estadoPago");
                    caja.className = "status pagado";
                    caja.innerHTML = `✅ ¡PAGO CONFIRMADO!<br><br><span style="font-size: 28px;">$${data.monto}</span><br><small style="font-size: 14px; font-weight: normal;">Hora: ${data.fecha}</small>`;
                    document.getElementById("btnLimpiar").style.display = "inline-block";
                }
            } catch (err) {
                console.log("Error conectando con el servidor:", err);
            }
        }

        async function limpiarPantalla() {
            await fetch(`${URL_SERVIDOR}/limpiar-pago`, { method: 'POST' });
            const caja = document.getElementById("estadoPago");
            caja.className = "status esperando";
            caja.innerHTML = "⏳ Esperando transferencia...";
            document.getElementById("btnLimpiar").style.display = "none";
        }

        // Consultar al servidor automáticamente cada 3 segundos
        setInterval(consultarPago, 3000);
    </script>

</body>
</html>
