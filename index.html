<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Heladería - Verificación y Contabilidad</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); text-align: center; }
        h1 { margin-top: 0; color: #1e293b; font-size: 22px; }
        p.sub { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        .status-box { padding: 25px 20px; border-radius: 14px; font-size: 18px; font-weight: bold; margin: 20px 0; transition: all 0.4s ease; }
        .esperando { background-color: #fef3c7; color: #b45309; border: 2px dashed #f59e0b; }
        .confirmado { background-color: #d1fae5; color: #047857; border: 2px solid #10b981; transform: scale(1.02); }

        .historial { margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 15px; text-align: left; }
        .historial h3 { font-size: 15px; color: #334155; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .item-pago { display: flex; justify-content: space-between; background: #f8fafc; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid #10b981; }
        .total-box { background: #0f172a; color: white; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍦 Heladería - Panel de Caja</h1>
        <p class="sub">Verificación automática y Contabilidad</p>

        <div id="pantallaEstado" class="status-box esperando">
            ⏳ Esperando transferencia de Bancolombia...
        </div>

        <div class="historial">
            <div id="totalAcumulado" class="total-box">
                Total acumulado: $0 COP
            </div>

            <h3>Historial de transferencias:</h3>
            <div id="listaHistorial">
                <!-- Se cargan automáticamente -->
            </div>
        </div>
    </div>

    <script>
        let temporizadorLimpieza = null;

        // Cargar todo el historial al abrir la página
        async function cargarHistorialGuardado() {
            try {
                let respuesta = await fetch('/historial');
                let datos = await respuesta.json();
                let lista = document.getElementById("listaHistorial");
                lista.innerHTML = "";

                let total = 0;

                datos.historial.forEach(pago => {
                    let montoFormateado = isNaN(pago.monto) ? pago.monto : `$${Number(pago.monto).toLocaleString('es-CO')} COP`;
                    if (!isNaN(pago.monto)) total += Number(pago.monto);

                    let item = document.createElement("div");
                    item.className = "item-pago";
                    item.innerHTML = `<span>${pago.fecha}</span> <span><strong>${montoFormateado}</strong> (${pago.banco})</span>`;
                    lista.appendChild(item);
                });

                document.getElementById("totalAcumulado").innerText = `Total acumulado: $${total.toLocaleString('es-CO')} COP`;
            } catch (e) {
                console.log("Error al cargar historial:", e);
            }
        }

        // Consultar pagos nuevos cada 2 segundos
        setInterval(async () => {
            try {
                let respuesta = await fetch('/consultar-pago');
                let datos = await respuesta.json();

                if (datos.nuevoPago) {
                    mostrarPagoExitoso(datos.pago.monto, datos.pago.banco, datos.pago.fecha);
                    cargarHistorialGuardado();
                }
            } catch (error) {
                console.log("Reconectando...");
            }
        }, 2000);

        function mostrarPagoExitoso(monto, banco, hora) {
            let pantalla = document.getElementById("pantallaEstado");
            let montoFormateado = isNaN(monto) ? monto : `$${Number(monto).toLocaleString('es-CO')} COP`;

            pantalla.className = "status-box confirmado";
            pantalla.innerHTML = `✅ ¡PAGO CONFIRMADO!<br>${montoFormateado}<br><small style="font-size:13px; font-weight:normal;">Recibido desde ${banco}</small>`;

            if (temporizadorLimpieza) clearTimeout(temporizadorLimpieza);

            temporizadorLimpieza = setTimeout(() => {
                pantalla.className = "status-box esperando";
                pantalla.innerHTML = "⏳ Esperando transferencia de Bancolombia...";
            }, 8000);
        }

        // Cargar apenas abra la página
        cargarHistorialGuardado();
    </script>

</body>
</html>
