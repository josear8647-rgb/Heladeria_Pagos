<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Pagos - Heladería</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }

        /* Estado Esperando (Amarillo) */
        .esperando {
            background-color: #f1c40f;
            color: #2c3e50;
        }

        /* Estado Pagado (Verde) */
        .pagado {
            background-color: #2ecc71;
            color: #ffffff;
        }

        .contenedor {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        h1 { font-size: 3rem; margin-bottom: 10px; }
        h2 { font-size: 4rem; margin: 20px 0; }
        p { font-size: 1.5rem; }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #ffffff;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="esperando" id="pantalla">

    <div class="contenedor">
        <h1 id="titulo">ESPERANDO PAGO...</h1>
        <h2 id="monto">$0</h2>
        <p id="origen">Esperando transferencia...</p>
        <button onclick="reiniciarCaja()">🔄 Reiniciar para nuevo cliente</button>
    </div>

    <script>
        async function consultarEstado() {
            try {
                const respuesta = await fetch('/estado-pago');
                const datos = await respuesta.json();

                const pantalla = document.getElementById('pantalla');
                const titulo = document.getElementById('titulo');
                const monto = document.getElementById('monto');
                const origen = document.getElementById('origen');

                // Si detecta un monto mayor a 0 o un estado de pago
                if (datos.monto && datos.monto !== 0 && datos.monto !== '$0') {
                    pantalla.className = 'pagado';
                    titulo.innerText = '¡PAGO RECIBIDO!';
                    monto.innerText = typeof datos.monto === 'number' ? `$${datos.monto}` : datos.monto;
                    origen.innerText = `Origen: ${datos.referencia || datos.origen || 'Bancolombia'}`;
                } else {
                    pantalla.className = 'esperando';
                    titulo.innerText = 'ESPERANDO PAGO...';
                    monto.innerText = '$0';
                    origen.innerText = 'Esperando transferencia...';
                }
            } catch (error) {
                console.error("Error consultando el servidor:", error);
            }
        }

        async function reiniciarCaja() {
            try {
                await fetch('/reiniciar', { method: 'POST' });
                consultarEstado();
            } catch (error) {
                console.error("Error al reiniciar la caja:", error);
            }
        }

        // Consultar el estado cada 1 segundo en tiempo real
        setInterval(consultarEstado, 1000);
        consultarEstado();
    </script>
</body>
</html>
